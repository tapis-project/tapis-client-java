# ------------------------------------------------------------------------------
# --- Components ---------------------------------------------------------------
# ------------------------------------------------------------------------------
components:
  securitySchemes:
    TapisJWT:
      type: apiKey
      description: Tapis signed JWT token authentication
      name: X-Tapis-Token
      in: header
  schemas:
    # ------------------------------------------------------------------------------
    # --- Model objects ------------------------------------------------------------
    # ------------------------------------------------------------------------------
    # --- Job ------------------------------------------------------------------
    Job:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        owner:
          type: string
        tenant:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING_INPUTS
            - STAGING_INPUTS
            - STAGING_JOB
            - SUBMITTING_JOB
            - QUEUED
            - RUNNING
            - ARCHIVING
            - BLOCKED
            - PAUSED
            - FINISHED
            - CANCELLED
            - FAILED
        condition:
          type: string
          enum:
            - CANCELLED_BY_USER
            - JOB_ARCHIVING_FAILED
            - JOB_DATABASE_ERROR
            - JOB_EXECUTION_MONITORING_ERROR
            - JOB_EXECUTION_MONITORING_ERROR_TIMEOUT
            - JOB_EXECUTION_MONITORING_TIMEOUT
            - JOB_FILES_SERVICE_ERROR
            - JOB_INTERNAL_ERROR
            - JOB_INVALID_DEFINITION
            - JOB_LAUNCH_FAILURE
            - JOB_QUEUE_MONITORING_ERROR
            - JOB_RECOVERY_FAILURE
            - JOB_RECOVERY_TIMEOUT
            - JOB_REMOTE_ACCESS_ERROR
            - JOB_REMOTE_OUTCOME_ERROR
            - JOB_UNABLE_TO_STAGE_INPUTS
            - JOB_UNABLE_TO_STAGE_JOB
            - JOB_TRANSFER_FAILED_OR_CANCELLED
            - JOB_TRANSFER_MONITORING_TIMEOUT
            - NORMAL_COMPLETION
            - SCHEDULER_CANCELLED
            - SCHEDULER_DEADLINE
            - SCHEDULER_OUT_OF_MEMORY
            - SCHEDULER_STOPPED
            - SCHEDULER_TIMEOUT
            - SCHEDULER_TERMINATED
        lastMessage:
          type: string
        created:
          type: string
        ended:
          type: string
        lastUpdated:
          type: string
        uuid:
          type: string
        appId:
          type: string
        appVersion:
          type: string
        archiveOnAppError:
          type: boolean
          deprecated: true
        archiveMode:
          $ref: '#/components/schemas/ArchiveModeEnum'
        dynamicExecSystem:
          type: boolean
        execSystemId:
          type: string
        execSystemExecDir:
          type: string
        execSystemInputDir:
          type: string
        execSystemOutputDir:
          type: string
        execSystemLogicalQueue:
          type: string
        archiveSystemId:
          type: string
        archiveSystemDir:
          type: string
        dtnSystemId:
          type: string
        dtnSystemInputDir:
          type: string
        dtnSystemOutputDir:
          type: string
        nodeCount:
          type: integer
          format: int32
        coresPerNode:
          type: integer
          format: int32
        memoryMB:
          type: integer
          format: int32
        maxMinutes:
          type: integer
          format: int32
        fileInputs:
          type: string
        parameterSet:
          type: string
        execSystemConstraints:
          type: string
        subscriptions:
          type: string
        blockedCount:
          type: integer
          format: int32
        remoteJobId:
          type: string
        remoteJobId2:
          type: string
        remoteOutcome:
