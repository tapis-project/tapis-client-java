        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/hide:
    post:
      tags:
        - Jobs
      description: |-
        Hide a job by its UUID.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: hideJob
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              type: object
              nullable: true
      responses:
        '200':
          description: Hide the job successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespHideJob'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '409':
          description: Job is already in Terminal State (CANCELLED, FINISHED or FAILED). Job state conflicts with the cancel request. No action taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/unhide:
    post:
      tags:
        - Jobs
      description: |-
        Un-hide a job by its UUID.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: unhideJob
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              type: object
              nullable: true
      responses:
        '200':
          description: Unhide the job successfuly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespHideJob'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '409':
          description: Job is already in Terminal State (CANCELLED, FINISHED or FAILED). Job state conflicts with the cancel request. No action taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/annotations:
    patch:
      tags:
        - Jobs
      description: |-
        Adding tags or notes with the following behavior:
        ## Behavior
          - **Tags**: Repetitive tags will be ignored (case-sensitive merging)
          - **Notes**: Old notes will be updated with new values if the key is the same
          - If any of the tags/notes field is missing in the request body, the corresponding field in jobs will not be touched.

        ## Limits
          - Total number of bytes of tags/notes: **128KB maximum**. 
          - Depending on the byte-length of the characters, tags and notes can have 32768 (4-byte) - 131072 (ASCII) UTF-8 characters.
          - Overall, there is no guarantee of success if tags/notes exceed 32768 UTF-8 characters.

        ## Authorization 
          - Caller must be the job owner, creator, or tenant administrator

        **Note**: This operation merges new data with existing annotations rather than replacing them.
      operationId: patchJobAnnotations
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/ReqJobAnnotation'
        required: true
      responses:
        '200':
          description: Job annotations updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespJobAnnotations'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '409':
          description: Job state is not valid for updating annotations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
    put:
      tags:
        - Jobs
      description: |-
        Replace tags or notes with the provided values.
        
        ## Behavior
          - **Tags**: Completely replaces existing tags with the provided array
          - **Notes**: Completely replaces existing notes with the provided JSON object
          - **Clearing Data**: 
            - Provide empty array `[]` for tags to remove all tags
            - Provide empty object `{}` for notes to remove all notes
          - If any of the tags/notes field is missing in the request body, the corresponding field in jobs will not be touched.
        
        ## Limits
          - Total number of bytes of tags/notes: **128KB maximum**. 
          - Depending on the byte-length of the characters, tags and notes can have 32768 (4-byte) - 131072 (ASCII) UTF-8 characters.
          - Overall, there is no guarantee of success if tags/notes exceed 32768 UTF-8 characters.
        
        ## Authorization
          - The caller must be the job owner, creator, or a tenant administrator.
        
        **Note**: This operation completely replaces existing annotations rather than merging them.
      operationId: putJobAnnotations
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/ReqJobAnnotation'
        required: true
      responses:
        '200':
          description: Job annotations updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespJobAnnotations'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '409':
          description: Job state is not valid for updating annotations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []

  /jobs/{jobUuid}/resubmit:
    post:
      tags:
        - Jobs
      description: |-
        Resubmit a job for execution using the job's original parameters.  The main phases of job execution are:

          - validate input
          - check resource availability
          - stage input files
          - stage application code
          - launch application
          - monitor application
          - archive application output

        When a job is submitted its request payload is captured and available for resubmission using this API. The
        resubmitted job is assigned a new UUID and does not reference or have any special access to the original job's
        information once the orginal job's request is copied. The resubmitted job's execution can differ from the
        original job's if the application, system or other aspects of the execution environment have changed.
      operationId: resubmitJob
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              type: object
              nullable: true
      responses:
        '200':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespSubmitJob'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/sendEvent:
    post:
      tags:
        - Jobs
      description: |-
        Send a user event to an active job. The job must be in the same tenant as the caller, but no other authorization
        is needed. If the job has terminated the request will be rejected. The caller must specify a payload of
        non-empty string data in the *eventData* field. The *eventDetail* field can be set to further qualify the type
        of user event, which is useful when filtering events. If not provided the *eventDetail* defaults to "DEFAULT".

        Subscribers that register interest in events of type JOB_USER_EVENT will receive a notification as a result of
        this call.
      operationId: sendEvent
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReqUserEvent'
        required: true
      responses:
        '200':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  # --- Paths for Subscriptions ------------------------------------------
  /jobs/subscribe/{uuid}:
    delete:
      tags:
        - Subscriptions
      description: |-
        Depending on the UUID provide, this API either deletes a single subscription from a job or all subscriptions
        from a job. To delete single subscription, provide the UUID of that subscription as listed in the subscription
        retrieval result for the job.  To delete all a job's subscriptions, specify the job UUID.

        Like all Job subscription APIs, modifications only affect running jobs and never change the saved job
        definition. As a consequence, job resubmissions are not affected by runtime subscription changes.
      operationId: deleteSubscriptions
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChangeCount'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/subscribe/{jobUuid}:
    get:
      tags:
        - Subscriptions
      description:  |-
        Retrieve a job's subscriptions fom the Notifications service. After subscriptions expire or are deleted by user
        action they may no longer be listed in Notification service. To inspect the initial set of subscriptions
        assigned to a job, retrieve the job definition.
      operationId: getSubscriptions
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 100
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetSubscriptions'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
    post:
      tags:
        - Subscriptions
      description: |-
        Subcribe to a running job identified by it's UUID. The caller must be the job owner or a tenant administrator.

        Like all Job subscription APIs, modifications only affect running jobs and never change the saved job definition.
        As a consequence, job resubmissions are not affected by runtime subscription changes.

        The events to which one can subscribe are:

        - JOB_NEW_STATUS - the job has transitioned to a new status
        - JOB_INPUT_TRANSACTION_ID - a request to stage job input files has been submitted
        - JOB_ARCHIVE_TRANSACTION_ID - a request to archive job output files has been submitted
        - JOB_SUBSCRIPTION - a change to the job's subscriptions has occurred
        - JOB_SHARE_EVENT - a job resource has been shared or unshared
        - JOB_ERROR_MESSAGE - the job experienced an error
        - JOB_USER_EVENT - user generated events
        - ALL - all job event categories
      operationId: subscribe
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReqSubscribe'
        required: true
      responses:
        '200':
          description: Job subscription created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespResourceUrl'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
