openapi: 3.0.3
info:
  title: Tapis Jobs API
  description: The Tapis Jobs API executes jobs on Tapis systems.
  version: '26Q1.0'
  termsOfService: "https://tapis-project.org"
  contact:
    name: "Tapis Jobs API - CICSupport"
    url: "https://tapis-project.org"
    email: "cicsupport@tacc.utexas.edu"
  license:
    name: 3-Clause BSD License
    url: https://opensource.org/licenses/BSD-3-Clause
externalDocs:
  description: Tapis Project
  url: 'https://tapis-project.org'
servers:
  - url: 'http://localhost:8080/'
    description: Local test environment
    variables: {}
  - url: 'https://dev.develop.tapis.io/'
    description: Development environment
    variables: {}
tags:
  - name: General
    description: General service health and readiness of the Security Kernel (SK)
  - name: Jobs
    description: manage job execution and data
  - name: Subscriptions
    description: manage job subscriptions
  - name: Sharing
    description: |
      A previously submitted job can be shared with a user in the same tenant. Job resources that can shared are:
      JOB_HISTORY, JOB_RESUBMIT_REQUEST, JOB_OUTPUT. Sharing gives a user READ permission on the resource.

# ------------------------------------------------------------------------------
# --- Paths -------------------------------------------------------------------
# ------------------------------------------------------------------------------
paths:

  # --- Paths for General ------------------------------------------
  /jobs/healthcheck:
    get:
      tags:
        - General
      description: Lightweight health check for liveness. No authorization required.
      operationId: checkHealth
      responses:
        '200':
          description: Message received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespProbe'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespProbe'
  /jobs/readycheck:
    get:
      tags:
        - General
      description: Lightweight readiness check. No authorization required.
      operationId: readycheck
      responses:
        '200':
          description: Service ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespProbe'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespProbe'

  # --- Paths for Jobs ------------------------------------------
  /jobs/submit:
    post:
      tags:
        - Jobs
      description: |-
        Submit a job for execution.  The main phases of job execution are:

          - validate input
          - check resource availability
          - stage input files
          - stage application code
          - launch application
          - monitor application
          - archive application output

        At a minimum, the job name, application ID and application version must be specified in the request payload.
        The optional parameters available in a job request provide great flexibility but must be considered in the
        context of the application and system definitions. The actual values used during job execution are a combination
        of the values in this request and those specified in the job's application and system definitions. It's often
        desirable to keep the submission request simple by specifying common values in these other two definitions. See
        the [Job Submission Request](https://tapis.readthedocs.io/en/latest/technical/jobs.html#the-job-submission-request)
        documentation for details.
        The total number of tags of a job is limited to be 128 and the total size of tags/notes is limited to be 128K bytes.
      operationId: submitJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReqSubmitJob'
        required: true
      responses:
        '200':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespSubmitJob'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/cancel:
    post:
      tags:
        - Jobs
      description: |-
        Cancel a previously submitted job by its UUID.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: cancelJob
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              type: object
              nullable: true
      responses:
        '200':
          description: Job Cancellation Initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespCancelJob'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '409':
          description: Job is already in Terminal State (CANCELLED, FINISHED or FAILED). Job state conflicts with the cancel request. No action taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}:
    get:
      tags:
        - Jobs
      description: |-
        Retrieve a previously submitted job by its UUID.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: getJob
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetJob'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/history:
    get:
      tags:
        - Jobs
      description: |-
        Retrieve history of a previously submitted job by its UUID.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: getJobHistory
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Job's history retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespJobHistory'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/list:
    get:
      tags:
        - Jobs
      description: |-
        Retrieve list of jobs for which the user is the job owner, creator or a tenant administrator.

        Also list the jobs that are shared with the user. 
        listType allowed are: MY_JOBS, SHARED_JOBS, ALL_JOBS
      operationId: getJobList
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: startAfter
          in: query
          schema:
            type: integer
            format: int32
        - name: orderBy
          in: query
          schema:
            type: string
        - name: computeTotal
          in: query
          schema:
            type: boolean
        - name: listType
          in: query
          schema:
            type: string
            default: MY_JOBS
      responses:
        '200':
          description: Jobs List retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetJobList'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/output/download/{outputPath}:
    get:
      tags:
        - Jobs
      description: |-
        Download a job's output files using the job's UUID. By default, the job must be in a terminal state
        (FINISHED or FAILED or CANCELLED) for this command to execute. To execute when a job is not in a
        terminal state--and possibly receive incomplete results--set _allowIfRunning=true_.  

        The caller must be the job owner, creator or a tenant administrator. The _outputPath_ is always relative to the
        job output directory and must end with a '/'.
      operationId: getJobOutputDownload
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
        - name: outputPath
          in: path
          required: true
          schema:
            type: string
            default: ''
        - name: compress
          in: query
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          schema:
            type: string
            default: zip
        - name: allowIfRunning
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Job's output files downloaded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Input error.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/output/list/{outputPath}:
    get:
      tags:
        - Jobs
      description: |-
        Retrieve a job's output file listing using the job's UUID. By default, the job must be in a terminal state
        (FINISHED or FAILED or CANCELLED) for this command to execute. To execute when a job is not in a terminal
        state--and possibly receive incomplete results--set _allowIfRunning=true_.  

        The caller must be the job owner, creator or a tenant administrator. The _outputPath_ is always relative to the
        job output directory and must end with a '/'.
      operationId: getJobOutputList
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
        - name: outputPath
          in: path
          required: true
          schema:
            type: string
            default: ''
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: allowIfRunning
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Job's output files list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetJobOutputList'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/search:
    get:
      tags:
        - Jobs
      description: |-
        Retrieve list of jobs for the user based on search conditions in the query paramter on the dedicated search end-point.

        The caller must be the job owner, creator or a tenant administrator. 

        List of Jobs shared with the user can also be searched
      operationId: getJobSearchList
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: startAfter
          in: query
          schema:
            type: integer
            format: int32
        - name: orderBy
          in: query
          schema:
            type: string
        - name: computeTotal
          in: query
          schema:
            type: boolean
        - name: select
          in: query
          schema:
            type: string
        - name: listType
          in: query
          schema:
            type: string
            default: MY_JOBS
      responses:
        '200':
          description: Jobs Search List retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespJobSearchAllAttributes'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Jobs not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
    post:
      tags:
        - Jobs
      description: |-
        Retrieve list of jobs for the user based on search conditions in the request body and pagination information
        from the query paramter on the dedicated search end-point.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: getJobSearchListByPostSqlStr
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
        - name: skip
          in: query
          schema:
            type: integer
            format: int32
        - name: startAfter
          in: query
          schema:
            type: integer
            format: int32
        - name: orderBy
          in: query
          schema:
            type: string
        - name: computeTotal
          in: query
          schema:
            type: boolean
        - name: select
          in: query
          schema:
            type: string
        - name: listType
          in: query
          schema:
            type: string
            default: MY_JOBS
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Jobs Search List retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespJobSearchAllAttributes'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Jobs not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/status:
    get:
      tags:
        - Jobs
      description: |-
        Retrieve status of a previously submitted job by its UUID.

        The caller must be the job owner, creator or a tenant administrator.
      operationId: getJobStatus
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetJobStatus'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespName'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
      security:
        - TapisJWT: []
  /jobs/{jobUuid}/resubmit_request:
    get:
      tags:
        - Jobs
      description: 'Get Resubmit request for of a job in JSON format.  '
      operationId: getResubmitRequestJson
      parameters:
        - name: jobUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resumbit request for the job is retrieved sucessfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetResubmit'
        '400':
          description: Input error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '401':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespBasic'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
